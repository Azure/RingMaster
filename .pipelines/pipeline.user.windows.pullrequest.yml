# For full annotated example, please visit
#   https://cloudes.visualstudio.com/CDPX/_wiki?pagePath=%2FHome%2FYAML-Format%2FAnnotated-Example
# OS image: https://onebranch.visualstudio.com/Pipeline/_wiki/wikis/Pipeline.wiki?pagePath=%2FCDPx%20%252D%20Cross%252DPlatform%20Cloud%20Delivery%20Pipeline%2FUsage%2FOfficial%20Container%20Images%2FWindows%20Images&wikiVersion=GBwikiMaster&pageId=298
environment:
    host:
        os: 'windows'
    runtime:
        provider: 'appcontainer'
        image: 'onebranch.azurecr.io/windows/ltsc2022/vse2022:latest'
        source_mode: 'link'

versioning:
    commands:

build:
    commands:
        - !!buildcommand
          name: 'Build Vega'
          command: '.\build\build.cmd'
          logs:
              - include:
                  - '**/msbuild*.log'
          artifacts:
              - from: 'out\\'
                include:
                    - '**/*.*'

package:
    commands:

cloudtest_options:
    tenant_name: 'networkingnsmplus'
    testmap_location: '[BuildRoot]\outputs\build\Release-x64\CloudUnitTests\TestMap.xml'
    configuration: 'Release'
    platform: 'x64'
    properties:
        worker:
            VsTestVersion: 'v150'
        session:
            RetryOnFailureMode: 'TestCaseOnSameMachineAndThenNew'
            VstsTestResultAttachmentUploadBehavior: 'Always'
    
test:
    commands:
        - !!testcommand
          name: 'Vega Unit Test'
          command: 'build\unittests.cmd'
          fail_on_stderr: false
          testresults:
              - from: 'out'
                title: 'Vega Unit Test'
                type: 'vstest'
                include:
                    - '**/*.trx'

          codecoverage:
              - summary_file: 'CoverageReport\Cobertura.xml'
                report_directory: 'CoverageReport'
                coverage_tool: 'Cobertura'
                include:
                    - 'CoverageReport\Cobertura.xml'

publish:
    commands:

user_cleanup:
    commands:
